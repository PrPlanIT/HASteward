version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

git:
  branches:
    main: "^main$"
  tags:
    stable:     { pattern: "^v?\\d+\\.\\d+\\.\\d+$" }
    prerelease: { pattern: "^v?\\d+\\.\\d+\\.\\d+-.+" }
  versioning:
    branch_builds:
      default: { base_from: [stable], format: "{base}-dev+{sha}" }
    no_lineage: { mode: error }

vars:
  org: prplanit
  github_org: PrPlanIT
  gitlab_group: PrPlanIT
  repo: hasteward
  github_repo: HASteward

builds:
  # The image is a regular multi-stage Dockerfile build (not StageFreight's
  # self-build crucible). It produces a scratch image: the Go binary + restic.
  hasteward:
    kind: docker
    platforms: [linux/amd64]

  hasteward-bin:
    kind: binary
    builder: go
    from: ./cmd/hasteward
    output: hasteward
    env: { CGO_ENABLED: "0" }
    args:
      - "-ldflags"
      - "-s -w -X github.com/PrPlanIT/HASteward/src/version.Version={version} -X github.com/PrPlanIT/HASteward/src/version.Commit={sha} -X github.com/PrPlanIT/HASteward/src/version.BuildDate={date}"
    platforms: [linux/amd64, linux/arm64]

  # Reference fragments generated from THIS commit's binary, never a stale copy: stage
  # the freshly-built hasteward-bin as ./hasteward and run its docs generator. Emits
  # docs/assets/modules/{cli,env}-reference.md (one per registered generator). worktree:
  # true lands the tree at docs/assets/modules so narrate commits it and the docs-site
  # build's mkdocs snippets (--8<-- "assets/modules/…") assemble it into docs/reference/*.
  reference:
    kind: command
    stage:
      from: hasteward-bin
      as: hasteward
    command: [./hasteward, docs, generate, --output-dir, "{output}"]
    outputs:
      - { type: tree, source: docs/assets/modules, worktree: true }

  # Documentation site: build the MkDocs Material site from docs/ into a `site/`
  # tree that the `docs` pages target deploys. The mkdocs-material image ships an
  # ENTRYPOINT ["mkdocs"] that collides with the engine's `sh -c` invocation, so we
  # pip-install mkdocs-material into a plain python image instead. Local preview:
  # docker run --rm -p 8001:8000 -v "$PWD":/docs squidfunk/mkdocs-material:9 serve -f docs/assets/mkdocs/mkdocs.yml -a 0.0.0.0:8000
  docs-site:
    kind: command
    image: docker.io/library/python:3.12-slim
    command: "pip install --quiet --root-user-action=ignore mkdocs-material && mkdocs build -f docs/assets/mkdocs/mkdocs.yml --strict --site-dir $(pwd)/site"
    outputs:
      - { type: tree, source: site }

forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB

  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB

repos:
  primary:
    forge: gitlab
    project: "{var:gitlab_group}/{var:repo}"
    roles: [primary]
    branches:
      default: main
    worktree: "."

  github-mirror:
    forge: github
    project: "{var:github_org}/{var:github_repo}"
    roles: [mirror, publish-origin]
    sync:
      git: true
      releases: true

registries:
  dockerhub:
    provider: docker
    url: docker.io
    credentials: DOCKER
    default_path: "{var:org}/{var:repo}"

  harbor:
    provider: harbor
    url: cr.pcfae.com
    credentials: HARBOR
    default_path: "{var:org}/{var:repo}"

  # GitHub Container Registry (ghcr.io/prplanit/hasteward, resolves under the PrPlanIT
  # GitHub org). Public GHCR pulls have NO rate limits (unlike anonymous Docker Hub) —
  # this is the default source for `hasteward update`. Auth: GHCR_USER + GHCR_TOKEN (a PAT
  # with write:packages) in CI. NOTE: make the package PUBLIC in GitHub package settings
  # for anonymous `update` pulls to work.
  ghcr:
    provider: ghcr
    url: ghcr.io
    credentials: GHCR
    default_path: "{var:org}/{var:repo}"

publish:
  # ── Stable releases → all registries (fans via registry: list) ───
  stable:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: hasteward
    tags: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  # ── Pre-releases (alpha/beta/rc) → Docker Hub + GHCR ─────────────
  prerelease:
    kind: registry
    registry: [dockerhub, ghcr]
    build: hasteward
    tags: ["v{version}"]
    when: { git_tags: [prerelease], events: [tag] }

  # ── Dev builds on every commit → all registries (retained/pruned) ──
  dev:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: hasteward
    tags: ["dev-{sha:8}", "latest-dev"]
    when: { branches: [main], events: [push] }
    retention:
      keep_last: 6
      protect: ["latest-dev"]

  # ── Project metadata: sync identity (readme, description, website,
  #    topics, logo) to every capable registry AND forge repo ───────
  project-metadata:
    kind: metadata
    registry: [dockerhub, harbor]        # registry overview/description pages (GHCR has no description API)
    repos: [primary, github-mirror]      # GitLab + GitHub project pages
    readme: README.md                    # long markdown body (registries with an overview field)
    description:
      - "High Availability Steward — a (WIP) Go CLI and Kubernetes operator for database cluster triage, repair, backup, and restore. Restic-backed backups (block-level dedup, encryption, compression)."
      - "HA Steward — a WIP Go CLI + Kubernetes operator for database cluster triage, repair, backup & restore."
    website: https://hasteward.prplanit.com
    topics: [cnpg, cloudnativepg, galera, mariadb, postgresql, kubernetes, high-availability, backup, restore, disaster-recovery, database, cli, golang]
    logo: docs/assets/logo-192.png       # project avatar (project-scoped forge avatars)
    when: { branches: [main], events: [push, tag] }

  # ── Binary archives: linux amd64/arm64 + SHA256SUMS ──────────────
  # ONE archive recipe, fired on EITHER trigger (when: OR-list) — {version}
  # differentiates stable (1.2.3) from dev (1.2.3-dev+sha); feeds both releases.
  hasteward-binaries:
    kind: binary-archive
    build: hasteward-bin
    name: "hasteward-{version}-{os}-{arch}"
    format: auto
    checksums: true
    when:
      - { git_tags: [stable], events: [tag] }   # feeds primary-release
      - { branches: [main], events: [push] }    # feeds dev-release

  # ── Primary release (rolling git tag aliases + binaries) ─────────
  # Authored on the primary forge (GitLab); mirrored to GitHub via
  # repos.github-mirror.sync.releases (no separate github release target).
  primary-release:
    kind: release
    type: latest
    repos: [primary]
    archives: hasteward-binaries
    aliases: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

  # ── Dev binary release channel (GitLab): rolling latest-dev +
  #    retained immutable dev-{sha8}, pruned like the docker dev images.
  dev-release:
    kind: release
    repos: [primary]
    archives: hasteward-binaries
    tag: "dev-{sha:8}"
    aliases: ["latest-dev"]
    type: prerelease
    retention:
      keep_last: 6
      protect: ["latest-dev"]
    when: { branches: [main], events: [push] }

  # ── Documentation site → Cloudflare Pages ────────────────────────
  # Deploys the built docs-site tree to hasteward.prplanit.com, once per release tag.
  # Cloudflare auto-creates the project + wires DNS. Credentials: CLOUDFLARE_API_TOKEN +
  # CLOUDFLARE_ACCOUNT_ID.
  docs:
    kind: pages
    provider: cloudflare
    project: hasteward
    build: docs-site
    domain: hasteward.prplanit.com
    when: { git_tags: [stable], events: [tag] }

  # ── Documentation site → GitHub Pages (test, alongside Cloudflare) ──
  # Force-pushes the same docs-site tree to the gh-pages branch of the GitHub mirror,
  # served at https://prplanit.github.io/HASteward/. No custom domain — Cloudflare owns
  # hasteward.prplanit.com; mkdocs' relative URLs render under the /HASteward/ subpath.
  # Requires GITHUB_TOKEN (contents:write + Pages/administration). The provider enables
  # GitHub Pages itself (source = gh-pages) via the API after the push — no manual toggle.
  docs-github:
    kind: pages
    provider: github
    project_id: "{var:github_org}/{var:github_repo}"
    credentials: GITHUB
    build: docs-site
    when: { git_tags: [stable], events: [tag] }

build_cache:
  mode: hybrid
  external:
    registry: harbor
    path: "cache"
    fallback: "main"
  local:
    retention:
      max_age: "7d"
      max_size: "8GB"

# Test suite: `go test ./...` with statement coverage. Declaring a suite replaces
# the auto-synthesized one (adding -cover) and gates regressions — the whole-module
# statement total (currently ~17%) must stay >= coverage_min or the suite fails (gate:
# perform, the default). Floor set below current with headroom; raise as coverage grows.
test:
  enabled: true
  suites:
    unit:
      tool: go
      coverage: true
      coverage_min: 15

commit:
  default_type: docs
  conventional: true
  backend: git

dependency:
  enabled: true
  output: ".stagefreight/deps"
  scope:
    go_modules: true
    dockerfile_env: true
  commit:
    enabled: true
    type: chore
    message: "update managed dependencies"
    push: true
    skip_ci: false

lint:
  level: full
  exclude:
    - "*.ttf"
    - "*.png"
    - "*.jpg"
    - "*.ico"
    - "*.woff"
    - "*.woff2"
  modules:
    freshness:
      enabled: true
      cache_ttl: 300
      sources:
        docker_images: true
        github_releases: true
        go_modules: true
      vulnerability:
        enabled: true
    tabs:
      enabled: true
    secrets:
      enabled: true
      exclude:
        - "go.sum"
    conflicts:
      enabled: true
    filesize:
      enabled: true
    unicode:
      enabled: true
      detect_bidi: true
      detect_zero_width: true
      detect_control_ascii: true

release:
  enabled: true
  security_summary: true
  registry_links: true

security:
  enabled: true
  output: ".stagefreight/security"
  sbom: true
  release_detail: full

toolchains:
  trivy: "0.69.3"
  syft: "1.42.3"
  grype: "0.110.0"
  osv-scanner: "2.3.5"
  cosign: "3.0.6"

# stencils: define each renderable once (id → stencil def). Inline defs render a
# badge (default) or a shield (render: shield); named producers render via type.
# Shared by scribe/narrate/release. (0.7.0 schema: moved out of scribe.content.)
stencils:
  # ── generated badges ──
  build:          { label: build,      message: "{env:BUILD_STATUS}", color: auto, font: monofur, link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}/-/pipelines" }
  license:        { label: license,    message: "AGPL-3.0-only", color: "#310937", font: monofur, link: LICENSE }
  release:        { label: release,    message: "v{base}", color: "#74ecbe", font: dejavu-sans, font_size: 11, link: "https://github.com/{var:github_org}/{var:github_repo}/releases" }
  updated:        { label: updated,    message: "{env:BUILD_DATE}", color: "#236144", font: dejavu-sans, font_size: 11 }
  pulls:          { label: pulls,      message: "{docker.pulls}", color: "#1d63ed", link: "https://hub.docker.com/r/{var:org}/{var:repo}" }
  release-latest: { label: latest,     message: "v{base}", color: "#74ecbe", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest" }
  dev-latest:     { label: latest-dev, message: "dev-{sha:8}", color: "#3b82f6", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest-dev" }
  dev-updated:    { label: updated,    message: "{docker.tag.latest-dev.updated}", color: "#236144" }
  dev-size:       { label: size,       message: "{docker.tag.latest-dev.size}", color: "#555", link: "https://hub.docker.com/r/{var:org}/{var:repo}/tags?name=latest-dev" }

  # ── inline shields ──
  donate:  { render: shield, message: donate,  color: "#FF5E5B", logo: ko-fi,          logo_color: white, link: "https://ko-fi.com/T6T41IT163" }
  sponsor: { render: shield, message: sponsor, color: "#EA4AAA", logo: githubsponsors, logo_color: white, link: "https://github.com/sponsors/{var:github_org}" }
  github:  { render: shield, label: GitHub, message: source, color: "#181717", logo: github, link: "https://github.com/{var:github_org}/{var:github_repo}" }
  gitlab:  { render: shield, label: GitLab, message: source, color: "#FC6D26", logo: gitlab, link: "https://gitlab.prplanit.com/{var:gitlab_group}/{var:repo}" }
  docker:  { render: shield, label: Docker, message: "{var:org}/{var:repo}", color: "#2496ED", logo: docker, logo_color: white, link: "https://hub.docker.com/r/{var:org}/{var:repo}" }

  # ── named producers (repo resolves from repos: publish-origin) ──
  go-report:    { type: goreportcard }
  last-commit:  { type: github-last-commit }
  issues-open:  { type: github-issues-open }
  contributors: { type: github-contributors }

scribe:
  # files: one placement region per marked span; items are stencil name-refs.
  files:
    readme.badges:
      file: "README.md"
      between: ["<!-- sf:badges:start -->", "<!-- sf:badges:end -->"]
      inline: true
      items: [build, license, release, updated, donate, sponsor]

    readme.project:
      file: "README.md"
      between: ["<!-- sf:project:start -->", "<!-- sf:project:end -->"]
      inline: true
      items: [github, gitlab, go-report, last-commit, issues-open, contributors]

    readme.image:
      file: "README.md"
      between: ["<!-- sf:image:start -->", "<!-- sf:image:end -->"]
      items: [docker, pulls]

  commit:
    type: docs
    message: "refresh generated docs and badges"
    add:
      - "README.md"
      - "docs/assets/modules"
      - ".stagefreight/scribe"
    push: true
    skip_ci: true
